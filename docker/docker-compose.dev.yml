services:
  pixi:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile

    stdin_open: true
    tty: true

    working_dir: /workspace

    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules

    ports:
      - "8080:8080"

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    command: >
      bash -lc "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
